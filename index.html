<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>크툴루의 부름 테이블</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Song+Myung&family=Hahmlet:wght@400;600&family=IM+Fell+English:ital@0;1&family=Special+Elite&display=swap">
<style>
:root{
  --ink:#12100e; --ink2:#171411; --panel:#1c1915; --panel2:#1a1714; --line:#2f2922; --line2:#3a332a; --line3:#5a4e3e;
  --text:#ece3cf; --text2:#d9cfba; --muted:#a89a82; --muted2:#968872;
  --paper:#e9dfc6; --paper2:#ddd2b6; --paperInk:#2b2118; --paperMuted:#5c4c3a;
  --blood:#8f2a22; --bloodBg:#2a1715; --bloodLine:#6b2520; --bloodText:#e8a79e;
  --gold:#c2a165; --san:#b9d3c0; --sanLine:#4a5e50;
  --serif:'Gowun Batang','Noto Serif KR','Nanum Myeongjo',serif;
  --title:'Song Myung','Gowun Batang',serif;
  --hand:'Hahmlet','Gowun Batang',serif;
  --type:'Special Elite','Courier New',monospace;
  --fell:'IM Fell English','Gowun Batang',serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--ink);color:var(--text);font-family:var(--serif);font-size:15px;line-height:1.6}
a{color:var(--gold)} a:hover{color:#e0c48a}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;min-height:40px;padding:8px 14px;background:transparent;border:1px solid var(--line3);border-radius:2px;color:var(--text)}
button:hover{border-color:var(--gold)}
button:disabled{opacity:.45;cursor:default}
button.primary{background:var(--blood);border-color:var(--blood);color:#f6ecd9}
button.primary:hover{background:#a3332a}
button.small{min-height:32px;padding:4px 10px;font-size:13px}
input,select,textarea{background:#0f0d0b;border:1px solid var(--line2);border-radius:2px;padding:8px 10px;color:var(--text)}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--gold);outline-offset:1px}
label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.label{font-family:var(--type);font-size:12px;letter-spacing:.06em;color:var(--gold);text-transform:uppercase}
.muted{color:var(--muted)} .small{font-size:13px}
.title{font-family:var(--title);font-weight:400}
.mono{font-family:var(--type)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.stack{display:flex;flex-direction:column;gap:10px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:2px;padding:14px 16px}
.paper{background:var(--paper);color:var(--paperInk);border-radius:2px;padding:18px 22px;box-shadow:0 10px 30px rgba(0,0,0,.45)}
.paper .muted{color:var(--paperMuted)}
.paper p{font-family:var(--hand);font-size:18px;line-height:1.75;margin:0;white-space:pre-line}
.keeper{border:1px solid var(--line2);background:var(--panel2);padding:14px 18px;border-radius:2px}
.keeper ul{margin:6px 0 0;padding-left:18px;color:var(--text2)} .keeper li{margin:4px 0}
.blood{background:var(--bloodBg);border:1px solid var(--bloodLine)}
.tag{display:inline-block;padding:2px 10px;border:1px solid var(--line2);border-radius:2px;font-size:12px;color:var(--muted)}
.tag.red{border-color:var(--bloodLine);color:var(--bloodText)}
.ok{color:var(--san)} .bad{color:var(--bloodText)} .gold{color:var(--gold)}
.hidden{display:none!important}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--paper);color:var(--paperInk);padding:10px 18px;border-radius:2px;box-shadow:0 8px 24px rgba(0,0,0,.5);z-index:50}

/* 로비 */
.lobby{max-width:880px;margin:0 auto;padding:48px 24px;display:flex;flex-direction:column;gap:28px}
.lobby h1{font-family:var(--title);font-weight:400;font-size:46px;margin:0;line-height:1.2}
.lobby .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}

/* 수호자 */
.k-head{display:flex;flex-wrap:wrap;align-items:center;gap:12px 24px;padding:14px 24px;border-bottom:1px solid var(--line2);background:var(--ink2)}
.k-body{display:flex;flex-wrap:wrap;align-items:stretch}
.k-nav{flex:1 1 220px;max-width:260px;padding:20px 16px;border-right:1px solid #2a251f;background:#15120f}
.k-nav button{display:block;width:100%;text-align:left;border:0;padding:6px 10px;min-height:34px;color:var(--muted);font-size:14px}
.k-nav button.on{background:var(--bloodBg);color:#f3d6cf;box-shadow:inset 0 0 0 1px var(--bloodLine)}
.k-nav .act{margin:16px 0 6px}
.k-main{flex:999 1 560px;min-width:0;padding:24px 28px;display:flex;flex-direction:column;gap:18px}
.k-side{flex:1 1 300px;max-width:400px;padding:20px;border-left:1px solid #2a251f;background:#15120f;display:flex;flex-direction:column;gap:14px}
.check{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;padding:12px 16px;background:var(--panel);border:1px solid var(--line);border-radius:2px}
.check .what{flex:1 1 260px;min-width:0}
.outcome{margin-top:6px;padding:8px 12px;border-left:0;background:#221d18;border-radius:2px;font-size:14px;color:var(--text2);width:100%}
.inv{padding:10px 12px;background:var(--panel);border:1px solid var(--line);border-radius:2px}
.stats4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;font-family:var(--type);font-size:13px;color:var(--muted)}
.stats4 b{font-weight:400;color:var(--text)}
.adj{display:flex;align-items:center;gap:2px}
.adj button{min-height:26px;padding:0 6px;font-size:12px}
.log{display:flex;flex-direction:column;gap:4px;font-size:14px;max-height:280px;overflow:auto}
.log .n{font-family:var(--type);min-width:34px;text-align:right;display:inline-block}
.flags{display:grid;grid-template-columns:1fr;gap:2px;max-height:260px;overflow:auto;font-size:13px}
.flags label{flex-direction:row;align-items:center;gap:6px;color:var(--text2)}

/* 탐사자 */
.p-wrap{max-width:560px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
.p-head{padding:16px 18px 12px;border-bottom:1px solid var(--line2);background:var(--ink2)}
.p-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-top:10px;text-align:center}
.p-stats div{padding:6px 0;border:1px solid var(--line2);border-radius:2px}
.p-stats .v{font-family:var(--type);font-size:18px}
.p-body{flex:1 1 auto;padding:14px 18px 90px;display:flex;flex-direction:column;gap:14px}
.p-tabs{position:fixed;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:1px solid var(--line2);background:var(--ink2);max-width:520px;margin:0 auto}
.p-tabs button{border:0;min-height:56px;color:var(--muted)}
.p-tabs button.on{color:var(--text);box-shadow:inset 0 2px 0 var(--blood)}
.dice{display:flex;gap:6px}
.dice span{width:44px;height:44px;display:flex;align-items:center;justify-content:center;background:var(--paper);color:var(--paperInk);font-family:var(--type);font-size:20px;border-radius:3px}
.dice span.drop{opacity:.35}
.skills{display:grid;grid-template-columns:1fr 70px;gap:4px 10px;align-items:center;font-size:14px}
.skills input{padding:4px 6px;text-align:right}
.chgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}

/* 테이블 */
.t-wrap{min-height:100vh;background:radial-gradient(ellipse at 50% 40%,#1f1b16 0%,#12100e 60%,#0a0908 100%);padding:36px 52px;display:flex;flex-direction:column;gap:24px}
.t-mid{flex:1 1 auto;display:flex;flex-wrap:wrap;gap:40px;align-items:center}
.t-read{flex:1 1 560px;font-family:var(--hand);font-size:clamp(22px,2.6vw,36px);line-height:1.6;white-space:pre-line}
.t-side{flex:0 1 380px;display:flex;flex-direction:column;gap:18px}
.t-roll{font-family:var(--type);font-size:88px;line-height:1}
.t-party{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.t-party>div{padding:12px 16px;border-top:2px solid var(--line3);background:rgba(28,25,21,.8)}
.handout-img{max-width:100%;max-height:52vh;display:block;margin-top:8px;border-radius:2px}
@media (max-width:700px){.k-nav,.k-side{max-width:none}.t-wrap{padding:20px}}

.k-side .stats4{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}

/* 탐사자 화면: 휴대폰은 탭, 컴퓨터는 세 칸 */
.pane{display:flex;flex-direction:column;gap:14px;min-width:0}
.pane-title{display:none}
@media (max-width:999px){
  .p-wrap .pane{display:none}
  .p-wrap[data-tab=roll] .pane-roll,.p-wrap[data-tab=notes] .pane-notes,.p-wrap[data-tab=sheet] .pane-sheet,.p-wrap[data-tab=log] .pane-log{display:flex}
}
@media (min-width:1000px){
  .p-wrap,.p-wrap.create{max-width:1560px}
  .p-head{padding:18px 32px 14px}
  .p-head .p-stats{max-width:640px}
  .p-body{display:grid;grid-template-columns:minmax(300px,360px) minmax(0,1fr) minmax(300px,420px);grid-template-areas:"sheet roll notes" "sheet log notes";align-items:start;gap:20px 28px;padding:24px 32px}
  .create .p-body{display:flex;flex-direction:column;align-items:stretch;max-width:1100px;margin:0 auto;width:100%}
  .pane-sheet{grid-area:sheet}.pane-roll{grid-area:roll}.pane-notes{grid-area:notes}.pane-log{grid-area:log}
  .pane-title{display:block}
  .p-tabs{display:none}
  .skills.wide{grid-template-columns:repeat(auto-fill,minmax(170px,1fr) 70px)}
  .pane-log .log{max-height:340px}
}

</style>

const E = (() => {
// 크툴루의 부름 7판 규칙 엔진
// - 브라우저와 Node 양쪽에서 쓰는 순수 함수 모음 (ES 모듈)
// - 모든 무작위는 rng 인자로 받는다: 테스트할 때 고정값을 넣고, 실제 게임에서는 Math.random
// - 쪽수 표기는 한국어판 수호자 룰북 쪽수

const LEVELS = ['fumble', 'fail', 'regular', 'hard', 'extreme', 'critical'];
const LEVEL_KO = {
  fumble: '대실패', fail: '실패', regular: '보통 성공',
  hard: '어려운 성공', extreme: '극단적 성공', critical: '대성공',
};
const rank = (lv) => LEVELS.indexOf(lv);
const DIFF_RANK = { regular: rank('regular'), hard: rank('hard'), extreme: rank('extreme') };

const defaultRng = () => Math.random();
const die = (sides, rng) => 1 + Math.floor(rng() * sides);

// ───────── 주사위 식 ─────────
// "3D6", "2D6+6", "1D4+2", "1D10+1D4+2", "-1", "1D3+DB", "1D3+DB/2"
// db: 피해 보너스 식 ("1D4", "-1", "0" 등). maxRoll이면 모든 주사위를 최대값으로.
function rollExpr(expr, { rng = defaultRng, db = '0', maxRoll = false } = {}) {
  const src = String(expr).replace(/\s+/g, '').toUpperCase();
  const terms = src.match(/[+-]?[^+-]+/g) || [];
  const parts = [];
  let total = 0;
  for (const raw of terms) {
    const sign = raw.startsWith('-') ? -1 : 1;
    const t = raw.replace(/^[+-]/, '');
    if (t === 'DB' || t === 'DB/2') {
      const sub = rollExpr(db, { rng, maxRoll });
      let v = sub.total;
      if (t === 'DB/2') v = Math.trunc(v / 2);
      total += sign * v;
      parts.push({ term: raw, value: sign * v });
      continue;
    }
    const m = t.match(/^(\d*)D(\d+)$/);
    if (m) {
      const n = Number(m[1] || 1), sides = Number(m[2]);
      const rolls = [];
      for (let i = 0; i < n; i++) rolls.push(maxRoll ? sides : die(sides, rng));
      const v = rolls.reduce((a, b) => a + b, 0);
      total += sign * v;
      parts.push({ term: raw, rolls, value: sign * v });
    } else if (/^\d+$/.test(t)) {
      total += sign * Number(t);
      parts.push({ term: raw, value: sign * Number(t) });
    } else {
      throw new Error(`알 수 없는 주사위 식: ${expr}`);
    }
  }
  return { expr, total, parts };
}

// ───────── 백분위 주사위 (p.89) ─────────
// 보너스·페널티는 서로 상쇄, 최대 2개. 10의 자리 주사위를 여럿 굴려
// 보너스면 가장 낮은 값, 페널티면 가장 높은 값을 쓴다. 00+0 = 100.
function rollD100({ bonus = 0, penalty = 0, rng = defaultRng } = {}) {
  let net = bonus - penalty;
  let overflow = 0;
  if (net > 2) net = 2;
  if (net < -2) { overflow = -net - 2; net = -2; }
  const units = die(10, rng) - 1;              // 0~9
  const tensCount = 1 + Math.abs(net);
  const tens = [];
  for (let i = 0; i < tensCount; i++) tens.push((die(10, rng) - 1) * 10); // 0~90
  const values = tens.map((t) => (t === 0 && units === 0 ? 100 : t + units));
  let value;
  if (net > 0) value = Math.min(...values);
  else if (net < 0) value = Math.max(...values);
  else value = values[0];
  return { value, units, tens, net, penaltyOverflow: overflow };
}

// ───────── 성공 수준 (p.87~88) ─────────
// target: 기능·특성치의 온전한 값
function successLevel(roll, target) {
  if (roll === 1) return 'critical';
  const fumbleFrom = target < 50 ? 96 : 100;
  if (roll >= fumbleFrom) return 'fumble';
  if (roll <= Math.floor(target / 5)) return 'extreme';
  if (roll <= Math.floor(target / 2)) return 'hard';
  if (roll <= target) return 'regular';
  return 'fail';
}

// 기준치 계산 (온전한 값 / 절반값 / 5분의 1값)
const half = (x) => Math.floor(x / 2);
const fifth = (x) => Math.floor(x / 5);
function requiredValue(target, difficulty = 'regular') {
  if (difficulty === 'hard') return half(target);
  if (difficulty === 'extreme') return fifth(target);
  return target;
}

// 대항 수치로 난이도 정하기 (p.86): 50 이상 어려움, 90 이상 극단적
function difficultyFromOpposition(value) {
  if (value >= 90) return 'extreme';
  if (value >= 50) return 'hard';
  return 'regular';
}

// ───────── 판정 ─────────
// kind: 'skill' | 'characteristic' | 'luck' | 'sanity' | 'combat'
// pushed: 이 판정이 강행 판정인지
function check({
  target, difficulty = 'regular', bonus = 0, penalty = 0,
  kind = 'skill', pushed = false, rng = defaultRng, forcedRoll = null,
}) {
  let diff = difficulty;
  const d = forcedRoll == null ? rollD100({ bonus, penalty, rng }) : { value: forcedRoll, net: bonus - penalty, penaltyOverflow: 0 };
  // 페널티가 2개를 넘으면 난이도 한 단계 상승 (p.112)
  for (let i = 0; i < (d.penaltyOverflow || 0); i++) {
    diff = diff === 'regular' ? 'hard' : 'extreme';
  }
  const level = successLevel(d.value, target);
  // 대실패 판정 기준은 '성공의 기준'(= 난이도 반영 값)으로 본다 (p.88)
  const req = requiredValue(target, diff);

function parseAI(text) {

  const a = t.indexOf('{'), b = t.lastIndexOf('}');
  if (a >= 0 && b > a) t = t.slice(a, b + 1);

    const sug = Array.isArray(o.suggestions) ? o.suggestions : Array.isArray(o.actions) ? o.actions : [];

  if (rules.characteristics.some((c) => c.ko === n)) return true;

        const n = (st.scn.npcs || []).find((x) => x.id === a.npc);
        if (!n || !(n.attacks || []).length) { no(a, '공격할 수 있는 NPC가 아님'); break; }
        if (!st.pids.includes(a.to)) { no(a, '대상 탐사자가 없음'); break; }
        a.atk = n.attacks.find((x) => x.name === a.attack) || n.attacks.find((x) => x.name.startsWith(String(a.attack || '').split(' ')[0])) || n.attacks[0];
        a.npcObj = n;
        count.npcAttack++; hasRoll = true; ok.push(a); break;
      }
      case 'scene': {
        const ex = (s.exits || []).find((e) => e.to === a.to && condFlags(e.if, st.flags));
        if (!ex) { no(a, '갈 수 없는 장면(출구가 아니거나 조건 미충족)'); break; }
        ok.push(a); break;
      }
      case 'wait': break;
      default: no(a, '허용되지 않은 행동');
    }
  }
  // 굴림이 남았거나 요청한 판정이 있으면 장면 이동은 미룬다
  const out = [];
  let moved = false;
  for (const a of ok) {
    if (a.type !== 'scene') { out.push(a); continue; }
    if (hasRoll || st.openReqs.length) rejected.push({ a, why: '판정이 끝난 뒤에 이동' });
    else if (moved) rejected.push({ a, why: '장면 이동은 하나만' });
    else { moved = true; out.push(a); }
  }
  return { ok: out, rejected };
}

/**
 * 지금 AI가 무엇을 해야 하는지 정한다.
 * s: { needOpen, ended, openReqs, needInt, newResults, newChat, go, quietMs, quietSec, chain, maxChain, idleMs, idleSec }
 */
function decide(s) {
  if (s.ended) return { task: null, why: '결말까지 진행했습니다' };
  if (s.chain >= s.maxChain) return { task: null, why: `탐사자 입력 없이 ${s.maxChain}번 연속 진행해서 잠시 멈췄습니다`, stop: true };
  if (s.openReqs > 0) return { task: null, why: '탐사자들의 판정을 기다리는 중' };
  if (s.needInt) return { task: null, why: '지능 판정을 기다리는 중' };
  if (s.needOpen) return { task: s.isEnding ? 'ending' : 'open' };
  if (s.newResults > 0) return { task: 'result' };
  if (s.newChat > 0) {
    if (s.go || s.quietMs >= s.quietSec * 1000) return { task: 'respond' };
    return { task: null, why: '탐사자들이 말을 마치길 기다리는 중', retryIn: s.quietSec * 1000 - s.quietMs + 200 };
  }
  if (s.idleSec && s.idleMs >= s.idleSec * 1000 && !s.nudged) return { task: 'next' };
  return { task: null, why: '탐사자들의 행동을 기다리는 중' };
}

function clockMinutes(c) {

  const v = (h ? +h[1] * 60 : 0) + (m ? +m[1] : 0);

}

function targetFor(inv, name) {
  if (!inv) return 0;
  name = safeKey(name);
  if (name === '운') return inv.luck;
  if (name === '이성') return inv.san;
  if (name === '지식') return inv.ch.EDU;
  if (name === '아이디어') return inv.ch.INT;
  if (CH[name]) return inv.ch[CH[name]];
  const sk = inv.skills || {};
  if (sk[name] != null) return sk[name];
  const cand = Object.entries(sk).filter(([k]) => k.startsWith(name + ' (') || name.startsWith(k + ' ('));
  if (cand.length) return Math.max(...cand.map(([, v]) => v));
  return null;
}
const kindOf = (skill) => (skill === '운' ? 'luck' : skill === '이성' ? 'sanity' : CH[skill] || ['지식', '아이디어'].includes(skill) ? 'characteristic' : 'skill');

function pickOutcome(outcomes, log) {
  if (!outcomes || !log) return null;
  const r = rankOf(log.level);
  if (log.level === 'critical' && outcomes.critical) return ['critical', outcomes.critical];
  if (log.level === 'fumble' && outcomes.fumble) return ['fumble', outcomes.fumble];
  if (log.success && r >= rankOf('extreme') && outcomes['extreme+']) return ['extreme+', outcomes['extreme+']];
  if (log.success && r >= rankOf('hard') && outcomes['hard+']) return ['hard+', outcomes['hard+']];
  if (log.success && outcomes.success) return ['success', outcomes.success];
  if (log.success && outcomes['hard+'] && !outcomes.success) return null;
  if (!log.success && outcomes.fail) return ['fail', outcomes.fail];
  return null;
}
const OUT_KO = { critical: '대성공', 'extreme+': '극단적 성공 이상', 'hard+': '어려운 성공 이상', success: '성공', fail: '실패', fumble: '대실패' };

// 이미지를 줄여 dataURL로
function shrinkImage(file, max = 1100) {
  return new Promise((res) => {
    const fr = new FileReader();
    fr.onload = () => {
      const img = new Image();
      img.onload = () => {
        const s = Math.min(1, max / Math.max(img.width, img.height));
        const c = document.createElement('canvas'); c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        res(c.toDataURL('image/jpeg', 0.82));
      };
      img.onerror = () => res(null);
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}

function keeper() {
  const KS = `coc-keeper-${ROOM}`;
  const saved = (() => { try { return JSON.parse(localStorage.getItem(KS) || '{}'); } catch { return {}; } })();
  const ks = Object.assign({ scene: null, flags: {}, once: {}, entered: {}, items: {}, panel: 'party', showKeeperMd: false, npcRoll: {}, aiCfg: { mode: 'firebase', model: 'gemini-3.5-flash', fallback: 'gemini-3.5-flash-lite', siteKey: '', debug: false }, aiHistory: [], aiOpen: true, aiSettings: false, memory: '', trail: [], journal: [], seenLogAt: 0, seenChatAt: 0, needOpen: false, chain: 0, ended: false, lastResults: [], pendingGoto: null, npcHp: {}, nudged: false, lastAiAt: 0, fails: 0 }, saved);
  ks.gm = Object.assign({ mode: 'assist', paused: false, quietSec: 10, idleSec: 0, maxChain: 3 }, ks.gm || {});
  let aiRes = null; let aiBusy = false; let aiErr = ''; let aiStatus = ''; let aiInfo = '';
  if (ks.aiCfg.fallback == null) ks.aiCfg.fallback = 'gemini-3.5-flash-lite';
  let scn = null; let images = {}; let keeperMd = '';
  const SCN = `coc-keeper-scn-${ROOM}`;
  try {
    const s = JSON.parse(localStorage.getItem(SCN) || 'null');

  } catch {}
  const save = () => { const { npcRoll, ...rest } = ks; localStorage.setItem(KS, JSON.stringify(rest)); };
  const scene = () => scn && scn.scenes.find((x) => x.id === ks.scene);
  const flagOn = (f) => !!ks.flags[f];
  const condOk = (c) => {
    if (!c) return true;
    return String(c).split('&').every((t) => { t = t.trim(); return t.startsWith('!') ? !flagOn(t.slice(1)) : flagOn(t); });
  };
  const invList = () => sortByAt(room.inv).map((x) => ({ ...x, pid: x.id }));

  async function loadFiles(files) {
    files = [...files];
    const rel = (f) => (f.webkitRelativePath || f.name).split('/').slice(f.webkitRelativePath ? 1 : 0).join('/');
    const sj = files.find((f) => rel(f).endsWith('scenario.json'));
    if (!sj) return toast('scenario.json을 찾지 못했습니다.');
    try { scn = JSON.parse(await sj.text()); } catch { return toast('scenario.json을 읽을 수 없습니다.'); }
    const md = files.find((f) => rel(f).endsWith('keeper.md'));
    keeperMd = md ? await md.text() : '';
    images = {};
    for (const h of scn.handouts || []) {
      if (!h.image) continue;
      const base = h.image.split('/').pop();
      const f = files.find((x) => rel(x) === h.image || rel(x).endsWith('/' + h.image)) || files.find((x) => x.name === base);
      if (f) images[h.image] = await shrinkImage(f);
    }
    try { localStorage.setItem(SCN, JSON.stringify({ scn, images, md: keeperMd })); }
    catch { try { localStorage.setItem(SCN, JSON.stringify({ scn, images: {}, md: keeperMd })); toast('그림이 커서 새로고침하면 다시 불러와야 합니다.'); } catch {} }
    ks.scene = scn.start; ks.flags = {}; ks.once = {}; ks.entered = {}; ks.items = {};
    enterScene(scn.start);
    await net.update('meta', { scenarioTitle: scn.meta.title, scenarioHanja: scn.meta.titleHanja || '', epigraph: scn.meta.epigraph || '' });
    toast(`「${scn.meta.title}」을 불러왔습니다.`);
  }

  function applyEffect(e, pid) {
    const inv = pid && room.inv[pid];
    switch (e.type) {
      case 'setFlag': ks.flags[e.flag] = true; break;
      case 'clearFlag': delete ks.flags[e.flag]; break;
      case 'give': ks.items[e.item] = true; break;
      case 'reveal': revealHandout(e.handout); break;
      case 'goto': if (autoOn()) ks.pendingGoto = e.scene; else goScene(e.scene); break;

      case 'damage': {

        for (const t of targets) { const amt = E.rollExpr(e.expr).total; damage(t, amt, `${e.expr}`); }

      case 'mp': if (inv) net.set(`inv/${pid}/mp`, Math.max(0, inv.mp + e.amount)); break;
      case 'mythos': if (inv) net.update(`inv/${pid}`, { [`skills/크툴루 신화`]: (inv.skills['크툴루 신화'] || 0) + e.amount, sanMax: inv.sanMax - e.amount }); break;
    }
    save(); render();
  }
  const effectLabel = (e) => ({ setFlag: `표시 켜기: ${flagName(e.flag)}`, clearFlag: `표시 끄기: ${flagName(e.flag)}`, give: `획득: ${itemName(e.item)}`, reveal: `핸드아웃 공개: ${e.handout}`, goto: `장면 이동`, clock: '시간 제한', damage: `피해 ${e.expr}${e.target === 'all' ? ' (전원)' : ''}`, sanity: `이성 ${e.loss}`, skill: `${e.skill} +${e.amount}`, mp: `마력 ${e.amount}`, mythos: `크툴루 신화 +${e.amount}` }[e.type] || e.type);
  const flagName = (f) => (scn?.flags.find((x) => x.id === f) || {}).label || f;
  const itemName = (i) => (scn?.items.find((x) => x.id === i) || {}).name || i;

    }

  function goScene(id) { enterScene(id); render(); window.scrollTo(0, 0); }

  function revealHandout(id) {

    if (!h) return;
    net.set(`handouts/${id}`, { title: h.title, text: h.text || '', note: h.note || '', image: images[h.image] || null, at: now() });

  // ═══ 자율 진행 (AI 단독 수호자) ═══
  const TAB = newKey();

  const npcShort = (n) => String(n.name || n.id).split(' (')[0];
  let autoWhy = ''; let lastBeat = 0;

  const isHost = () => { const h = room.meta && room.meta.autoHost; return !h || h.id === TAB || now() - (h.at || 0) > 30000; };
  const openReqList = () => sortByAt(room.req).filter((r) => { const tos = r.to === 'all' ? invList().map((i) => i.pid) : [r.to]; return tos.some((p) => room.inv[p] && !(r.done && r.done[p])); });
  function journal(e) { ks.journal = [...(ks.journal || []), { at: now(), ...e }].slice(-30); save(); }

  const findCheck = (id) => { for (const sc of scn.scenes) { const c = (sc.checks || []).find((x) => x.id === id); if (c) return c; } return null; };
  const META = /[a-z]+_[a-z0-9_]+|제안합니다|판정을 (?:요청|제안)|체크 항목|checkId|sanId/;
  function cleanNarr(t) {
    const parts = String(t || '').split(/(?<=[.!?…”"'])\s+/).filter(Boolean);

  function handleMelee(l, m) {
    const inv = room.inv[l.pid];
    const item = { 누가: l.name, pid: l.pid, 판정: `${m.npcName}의 ${m.attack}에 ${l.defense === 'fightBack' ? '반격' : '회피'}`, 결과: '' };
    if (!l.success) {
      const d = E.rollDamage({ damage: m.damage, impale: m.impale }, m.db || '0', { level: m.level });
      damage(l.pid, d.total, `${m.npcName} ${m.attack}`);
      item.결과 = `맞음 — 피해 ${d.total}${d.extreme ? ' (극단적 피해)' : ''}`;
    } else if (l.defense === 'fightBack' && inv) {
      const n = scn.npcs.find((x) => x.id === m.npc) || {};

    ks.lastResults.push(item);

  function processLogs() {
    for (const l of sortByAt(room.log)) {
      if ((l.at || 0) <= (ks.seenLogAt || 0)) continue;
      ks.seenLogAt = l.at;
      if (l.event || !l.pid) continue;
      const rq = l.reqId && room.req[l.reqId];
      if (rq && rq.melee) { handleMelee(l, rq.melee); continue; }
      const item = { 누가: l.name, pid: l.pid, 판정: l.title, 판정id: l.checkId || null, 결과: l.levelKo || (l.success ? '성공' : '실패'), 성공: !!l.success, 비고: l.detail || '' };

  function npcAttack(a) {

    if (!r.success) { ks.lastResults.push({ 누가: npcShort(n), 판정: `${atk.name}로 ${room.inv[a.to]?.name}을(를) 공격`, 결과: '빗나감', auto: true }); return `${npcShort(n)} 공격 빗나감`; }

  async function runAuto(task, newChats) {

      비밀_표시: '현재_장면.keeper, 장면_NPC의 secret, keeper.md는 수호자만 안다.',
    };
    const user = buildContext({ scn, keeperMd, scene: s, flags: ks.flags, party: invList(), logs: sortByAt(room.log), chat: sortByAt(room.chat), history: ks.aiHistory, actions: '', task, revealed: Object.keys(room.handouts || {}), extra, taskText: AUTO_TASKS[task] });
    let out;
    try {
      out = await askGemini(ks.aiCfg, FIREBASE_CONFIG, user, (st) => { aiStatus = st; const el = document.getElementById('aiStatus'); if (el) el.textContent = st; }, AUTO_SYSTEM);
    } catch (e) {
      ks.fails = (ks.fails || 0) + 1; ks.lastResults = [...results, ...ks.lastResults];
      const kind = aiErrorKind(e);
      ks.retryAt = now() + (kind === 'busy' ? 20000 : 8000);
      journal({ task, error: `${kind === 'busy' ? '모델이 붐빔' : 'AI 호출 실패'}: ${String(e.message || e).slice(0, 160)}` });
      if (ks.fails >= 3 || kind === 'appcheck' || kind === 'model') { ks.gm.paused = true; journal({ task: '멈춤', note: '연달아 실패해 자율 진행을 멈췄습니다. 설정을 확인한 뒤 다시 시작하세요.' }); }
      aiBusy = false; aiStatus = ''; net.update('meta', { ai: 'waiting' }); save(); render(); return;
    }
    ks.fails = 0;
    const res = parseAI(out.text);
    if (res.bad) {
      ks.retryAt = now() + 5000; ks.lastResults = [...results, ...ks.lastResults];
      journal({ task, error: 'AI 답이 JSON 형식이 아니어서 버렸습니다. 다시 시도합니다.' });
      aiBusy = false; aiStatus = ''; net.update('meta', { ai: 'waiting' }); save(); render(); return;
    }
    // 1) 묘사

    const lines = (res.npcLines || []).filter((l) => l && l.line && !META.test(l.line)).map((l) => { const n = scn.npcs.find((x) => x.id === l.npc); return { who: n ? npcShort(n) : String(l.npc || ''), line: String(l.line) }; });

    if (tableText) net.set('table', { title: s.title, act: s.act || '', read: tableText, at: now() });

    const vet = task === 'ending' ? { ok: [], rejected: (res.suggestions || []).map((a) => ({ a, why: '결말에서는 실행하지 않음' })) } : vetActions(res.suggestions, st);
    const did = [];
    for (const a of vet.ok) {
      if (a.type === 'check') request(a.check || { id: null, skill: a.skill, who: '수호자', difficulty: a.difficulty }, a.to);
      else if (a.type === 'sanity') requestSan(a.san || { loss: a.loss, trigger: '수호자' }, a.to);
      else if (a.type === 'reveal') revealHandout(a.handout);
      else if (a.type === 'flag') ks.flags[a.flag] = true;
      else if (a.type === 'npcAttack') { did.push(npcAttack(a)); continue; }

      did.push(actLabel(a));
    }

    // 3) 정리
    if (task === 'open' || task === 'ending') { if (!vet.ok.some((a) => a.type === 'scene')) ks.needOpen = false; }
    if (task === 'next') ks.nudged = true;
    const selfOnly = results.length > 0 && results.every((r) => r.auto);

  async function autoTick(force) {
    if (!scn || aiBusy || ks.gm.mode !== 'auto') return;

    if (now() - lastBeat > 10000) { lastBeat = now(); net.update('meta', { autoHost: { id: TAB, at: now() }, auto: !ks.gm.paused, autoQuiet: ks.gm.quietSec }); }
    if (ks.aiCfg.mode === 'manual') return setWhy('복사·붙여넣기 방식에서는 자율 진행을 할 수 없습니다. 설정에서 Firebase AI Logic으로 바꾸세요.');
    if (ks.gm.paused) return setWhy('일시정지 중입니다.');
    if (!force && ks.retryAt && now() < ks.retryAt) return setWhy('잠시 뒤 다시 시도합니다…');
    processLogs();
    const open = openReqList();
    if (!open.length && ks.pendingGoto) { const g = ks.pendingGoto; ks.pendingGoto = null; enterScene(g); render(); }
    const allChat = sortByAt(room.chat);
    const chats = allChat.filter((c) => (c.at || 0) > (ks.seenChatAt || 0) && c.pid);
    const lastChatAt = chats.length ? chats[chats.length - 1].at : 0;
    const lastLog = sortByAt(room.log).slice(-1)[0];
    const lastAct = Math.max(ks.lastAiAt || 0, allChat.length ? allChat[allChat.length - 1].at : 0, lastLog ? lastLog.at : 0);
    if (chats.length) ks.nudged = false;
    const d = decide({ ended: ks.ended, chain: ks.chain || 0, maxChain: ks.gm.maxChain, openReqs: open.length, needInt: invList().some((i) => i.needInt), needOpen: ks.needOpen, isEnding: (scene() || {}).act === 'ending', newResults: ks.lastResults.length, newChat: chats.length, go: force || chats.some((c) => c.go), quietMs: now() - lastChatAt, quietSec: ks.gm.quietSec, idleMs: now() - lastAct, idleSec: ks.gm.idleSec, nudged: ks.nudged });
    let task = d.task;
    if (!task && force && !d.stop && !open.length) task = 'next';
    if (d.stop && !force) { ks.gm.paused = true; ks.chain = 0; journal({ task: '멈춤', note: d.why }); net.update('meta', { auto: false }); save(); render(); return; }

    if (chats.length) ks.seenChatAt = lastChatAt;

    await runAuto(task, chats);

        ` : ''}

        <div class="row"><button class="small ${ks.panel === 'party' ? 'primary' : ''}" data-act="panel" data-p="party">탐사자</button><button class="small ${ks.panel === 'flags' ? 'primary' : ''}" data-act="panel" data-p="flags">진행 표시</button><button class="small ${ks.panel === 'items' ? 'primary' : ''}" data-act="panel" data-p="items">물건·핸드아웃</button></div>

        ${ks.panel === 'items' ? `<div class="stack small">${(scn.items || []).map((it) => `<div><b class="${ks.items[it.id] ? 'ok' : ''}">${ks.items[it.id] ? '획득 · ' : ''}${esc(it.name)}</b><div class="muted">${esc(it.player || '')}</div>${it.secret ? `<div class="bad">${esc(it.secret)}</div>` : ''}</div>`).join('')}<div class="label">핸드아웃</div>${(scn.handouts || []).map((h) => `<div class="row" style="justify-content:space-between"><span>${esc(h.title)}</span><button class="small" data-act="${room.handouts && room.handouts[h.id] ? 'hide' : 'reveal'}" data-id="${h.id}">${room.handouts && room.handouts[h.id] ? '공개 취소' : '공개'}</button></div>`).join('')}</div>` : ''}
        <div class="label">Table talk · 탐사자들의 말</div>

        <div class="label">Waiting · 대기 중인 요청 ${openReq.length}</div>
        <div class="stack small">${openReq.map((r) => `<div class="row" style="justify-content:space-between"><span>${esc(r.title)} <span class="muted">→ ${r.to === 'all' ? '전원' : esc(room.inv[r.to]?.name || '?')}</span></span><button class="small" data-act="cancelReq" data-id="${r.id}">취소</button></div>`).join('') || '<span class="muted">없음</span>'}</div>
        <div class="row" style="justify-content:space-between"><span class="label">Roll log · 굴림 기록</span><button class="small" data-act="exportLog">저장</button></div>

  };

  net = connect(ROOM, { local: LOCAL });

// ═════════ 탐사자 ═════════
function player() {
  const PK = `coc-pid-${ROOM}`;
  let pid = q.get('pid') || localStorage.getItem(PK);
  if (!pid) { pid = newKey(); localStorage.setItem(PK, pid); }
  const ui = { tab: 'roll', draft: null, social: {}, lastLog: null, filter: '' };
  const me = () => room.inv[pid];

  function newDraft() {
    const ch = Object.fromEntries(RULES.characteristics.map((c) => [c.key, 50]));
    return { name: '', occupation: '', age: 25, ch, luck: 50, skills: normSkills(E.baseSkills(RULES, ch)), edited: {} };
  }
  function rollDraft(d) {
    d.ch = E.rollCharacteristics(RULES); d.luck = E.rollLuck(RULES, d.age);
    const base = normSkills(E.baseSkills(RULES, d.ch));
    for (const k of Object.keys(base)) if (!d.edited[k]) d.skills[k] = base[k];
  }
  function syncBase(d) {
    const base = normSkills(E.baseSkills(RULES, d.ch));
    for (const k of Object.keys(base)) if (!d.edited[k]) d.skills[k] = base[k];
  }
  async function saveDraft(d) {
    if (!d.name.trim()) return toast('이름을 넣어 주세요.');
    const dv = E.derived(RULES, d.ch, { age: d.age, cthulhuMythos: d.skills['크툴루 신화'] || 0 });
    try { await net.set(`inv/${pid}`, {
      at: now(), name: d.name.trim(), occupation: d.occupation.trim(), age: d.age, ch: d.ch, skills: d.skills,
      hpMax: dv.hpMax, hp: dv.hpMax, mpMax: dv.mpMax, mp: dv.mpMax, san: dv.san, sanMax: dv.sanMax, luck: d.luck,
      db: dv.db, build: dv.build, mov: dv.mov, dayStartSan: dv.san, lostToday: 0, state: '정상', marks: {},
    }); } catch (err) { return toast(`저장하지 못했습니다: ${err.message || err}`); }
    ui.draft = null; render();
  }

  async function doRoll(r, opts = {}) {
    const inv = me();
    let skill = r.skill;
    if (skill === '대인관계') skill = ui.social[r.id] || SOCIAL.reduce((a, b) => ((targetFor(inv, b) || 0) > (targetFor(inv, a) || 0) ? b : a));
    if (r.melee && opts.defense === 'fightBack') skill = Object.keys(inv.skills || {}).filter((k) => k.startsWith('근접전')).sort((a, b) => inv.skills[b] - inv.skills[a])[0] || '근접전 (격투)';
    let target = targetFor(inv, skill);
    if (target == null) {
      const v = parseInt(prompt(`${skill} 값이 시트에 없습니다. 값을 넣어 주세요.`, '0'), 10);
      if (isNaN(v)) return; target = v;
    }
    const kind = r.kind || kindOf(skill);
    const res = E.check({ target, difficulty: r.difficulty || 'regular', bonus: r.bonus || 0, penalty: r.penalty || 0, kind, pushed: !!opts.pushed });
    const entry = { at: now(), pid, name: inv.name, reqId: r.id, checkId: r.checkId || null, title: `${skill}${r.difficulty === 'hard' ? ' (어려움)' : r.difficulty === 'extreme' ? ' (극단적)' : ''}${opts.pushed ? ' · 강행' : ''}`, skill, kind, target, required: res.required, roll: res.roll, tens: res.dice.tens || [], units: res.dice.units ?? null, level: res.level, levelKo: res.levelKo, success: res.success, pushed: !!opts.pushed, difficulty: res.difficulty, bonus: r.bonus || 0, penalty: r.penalty || 0, canPush: res.canPush && !r.opposed };

    if (r.melee) {
      const defense = opts.defense || 'dodge';
      const m = E.resolveMelee({ success: true, level: r.melee.level }, res, defense);
      entry.defense = defense; entry.success = !m.hit; entry.canPush = false;
      entry.title = `${defense === 'fightBack' ? '반격' : '회피'} (${skill}) — ${r.melee.npcName}의 ${r.melee.attack}`;
      entry.detail = `상대 ${r.melee.roll} ${r.melee.levelKo} → ${m.hit ? '맞음' : defense === 'fightBack' ? '반격 성공' : '피함'}`;
    }
    if (r.opposed) {
      const o = E.check({ target: r.opposed.value, kind });
      const cmp = E.opposed({ ...res, success: res.success }, o);
      entry.opp = { label: r.opposed.label, value: r.opposed.value, roll: o.roll, levelKo: o.levelKo };
      entry.success = cmp.winner === 'a';
      entry.detail = `${r.opposed.label} ${o.roll} ${o.levelKo} → ${entry.success ? '이김' : cmp.winner ? '짐' : '교착'}`;
    }
    if (kind === 'sanity') {
      const lossParts = E.parseSanLoss(r.loss.includes('/') ? r.loss : `${r.loss}/${r.loss}`);
      let loss = 0;
      if (!r.loss.includes('/')) { loss = E.rollExpr(r.loss).total; entry.detail = '판정 없이 잃음'; entry.roll = null; entry.levelKo = ''; entry.success = false; }
      else if (res.success) loss = E.rollExpr(lossParts.onSuccess).total;
      else if (res.level === 'fumble') loss = E.rollExpr(lossParts.onFail, { maxRoll: true }).total;
      else loss = E.rollExpr(lossParts.onFail).total;
      const ap = E.applySanLoss({ san: inv.san, dayStartSan: inv.dayStartSan ?? inv.san, lostToday: inv.lostToday || 0, insanity: inv.insanity || null }, loss);
      entry.loss = loss; entry.effects = ap.effects;
      entry.title = `이성 ${r.loss}`;
      entry.detail = `${entry.detail ? entry.detail + ' · ' : ''}이성 ${loss} 잃음 (${inv.san}→${ap.state.san})${ap.effects.includes('needIntRoll') ? ' · 지능 판정 필요' : ''}${ap.effects.includes('indefinite') ? ' · 장기적 광기' : ''}${ap.effects.includes('permanent') ? ' · 영구적 광기' : ''}${ap.effects.includes('boutWhileInsane') ? ' · 광기 발작' : ''}`;
      const upd = { san: ap.state.san, lostToday: ap.state.lostToday, dayStartSan: ap.state.dayStartSan };
      if (ap.effects.includes('indefinite')) { upd.insanity = 'indefinite'; upd.state = '장기적 광기'; }
      if (ap.effects.includes('permanent')) { upd.insanity = 'permanent'; upd.state = '영구적 광기'; }
      if (ap.effects.includes('needIntRoll')) upd.needInt = true;
      await net.update(`inv/${pid}`, upd);
    }
    if (entry.success && kind === 'skill' && !(r.bonus > 0) && !r.opposed && skill !== '크툴루 신화') await net.set(`inv/${pid}/marks/${safeKey(skill)}`, true);
    const lid = await net.push('log', entry);
    ui.lastLog = lid;
    if (r.id && !opts.free) await net.set(`req/${r.id}/done/${pid}`, lid);
    render();
  }
  async function intRoll() {
    const inv = me();
    const res = E.check({ target: inv.ch.INT, kind: 'characteristic' });
    const t = E.resolveTemporaryInsanity(res);
    await net.update(`inv/${pid}`, { needInt: null, ...(t.insane ? { insanity: inv.insanity || 'temporary', state: inv.insanity === 'indefinite' ? '장기적 광기' : '일시적 광기' } : {}) });
    const lid = await net.push('log', { at: now(), pid, name: inv.name, title: '지능 — 이성 5 이상 잃음', roll: res.roll, level: res.level, levelKo: res.levelKo, success: res.success, detail: t.insane ? '일시적 광기 · 광기의 발작' : '기억을 억누르고 광기를 면함' });
    ui.lastLog = lid; render();
  }

  actions.tab = (d) => { ui.tab = d.t; render(); };
  actions.say = async () => { const el = document.getElementById('chatText'); const t = el.value.trim(); if (!t) return; el.value = ''; await net.push('chat', { at: now(), pid, name: me().name, text: t.slice(0, 600) }); };
  actions.roll = (d) => { const r = { id: d.id, ...room.req[d.id] }; doRoll(r, d.def ? { defense: d.def } : {}); };
  actions.sayGo = async () => { const el = document.getElementById('chatText'); const t = el.value.trim(); el.value = ''; await net.push('chat', { at: now(), pid, name: me().name, text: (t || '(차례를 넘깁니다)').slice(0, 600), go: true }); };
  actions.social = (d, el) => { ui.social[d.id] = el.value; };
  actions.push = (d) => { const l = room.log[d.lid]; const r = room.req[l.reqId] ? { id: l.reqId, ...room.req[l.reqId] } : { skill: l.skill, kind: l.kind, difficulty: 'regular', bonus: l.bonus, penalty: l.penalty, checkId: l.checkId }; doRoll(r, { pushed: true, free: !room.req[l.reqId] }); };
  actions.luck = async (d) => {
    const l = room.log[d.lid]; const inv = me(); const cost = Number(d.cost);
    const res = E.spendLuck({ ...l, difficulty: l.difficulty || 'regular' }, cost);
    await net.update(`log/${d.lid}`, { roll: res.roll, level: res.level, levelKo: res.levelKo, success: res.success, luckSpent: cost, canPush: false, detail: `운 ${cost} 사용` });
    await net.set(`inv/${pid}/luck`, inv.luck - cost);
  };
  actions.intRoll = () => intRoll();
  actions.selfRoll = () => { const s = document.getElementById('selfSkill').value; if (s) doRoll({ skill: s, kind: kindOf(s), difficulty: document.getElementById('selfDiff').value }, { free: true }); };
  actions.draftNew = () => { ui.draft = newDraft(); render(); };
  actions.draftRoll = () => { rollDraft(ui.draft); render(); };
  actions.draftQuick = () => {
    const d = ui.draft; rollDraft(d);
    const names = ['한도윤', '이서현', '박정우', '최유나', '정하늘', '윤재민']; const jobs = ['사진작가', '민속학 대학원생', '기자', '간호사', '고등학교 교사', '택시 기사'];
    d.name = d.name || names[Math.floor(Math.random() * names.length)]; d.occupation = d.occupation || jobs[Math.floor(Math.random() * jobs.length)];
    for (const [k, v] of [['관찰력', 60], ['자료 조사', 55], ['듣기', 50], ['심리학', 45], ['설득', 40], ['근접전 (격투)', 45], ['자동차 운전', 40], ['응급처치', 45]]) { d.skills[k] = Math.max(d.skills[k], v); d.edited[k] = true; }
    render();
  };
  actions.draftSave = () => saveDraft(ui.draft);
  actions.draftField = (d, el) => {
    const dr = ui.draft;
    if (d.f === 'ch') { dr.ch[d.k] = Math.max(0, parseInt(el.value, 10) || 0); syncBase(dr); }
    else if (d.f === 'skill') { dr.skills[d.k] = Math.max(0, parseInt(el.value, 10) || 0); dr.edited[d.k] = true; }
    else if (d.f === 'age' || d.f === 'luck') dr[d.f] = parseInt(el.value, 10) || 0;
    else dr[d.f] = el.value;
    render();
  };
  actions.sheetSkill = (d, el) => net.set(`inv/${pid}/skills/${d.k}`, Math.max(0, parseInt(el.value, 10) || 0));
  actions.improve = async () => {
    const inv = me(); const out = []; let sanGain = 0;
    for (const k of Object.keys(inv.marks || {})) {
      const r = E.improveSkill(inv.skills[k] || 0);
      if (r.improved) { await net.set(`inv/${pid}/skills/${k}`, r.value); out.push(`${k} +${r.gain}`); if (r.crossed90) sanGain += E.rollExpr('2D6').total; }
    }
    await net.set(`inv/${pid}/marks`, {});
    if (sanGain) await net.set(`inv/${pid}/san`, Math.min(inv.sanMax, inv.san + sanGain));
    await net.push('log', { at: now(), pid, name: inv.name, title: '성장 판정', event: true, detail: out.join(', ') || '오른 기능 없음' });
    toast(out.length ? `성장: ${out.join(', ')}` : '이번에는 오른 기능이 없습니다.');
  };
  actions.filter = (d, el) => { ui.filter = el.value; render(); };

  function diceView(l) {
    if (!l || l.roll == null) return '';
    const tens = l.tens && l.tens.length ? l.tens : [Math.floor((l.roll % 100) / 10) * 10];
    const chosen = l.roll === 100 ? 0 : Math.floor(l.roll / 10) * 10;
    let used = false;
    return `<div class="dice" aria-hidden="true">${tens.map((t) => { const on = !used && t === chosen; if (on) used = true; return `<span class="${on || tens.length === 1 ? '' : 'drop'}">${String(t).padStart(2, '0')}</span>`; }).join('')}<span>${l.units ?? l.roll % 10}</span></div>`;
  }
  function viewResult(l, lid) {
    const inv = me();
    const luckOpts = !l.pushed && !l.luckSpent && !l.success && ['skill', 'characteristic'].includes(l.kind) && !l.opp && !l.defense ? E.luckSpendOptions({ ...l, kind: l.kind }, inv.luck) : [];
    return `<section class="card" aria-label="결과">
      <div class="row" style="gap:14px">${diceView(l)}
        <div><div style="font-size:17px">${l.roll ?? ''} · <span class="${l.success ? 'ok' : 'bad'}">${esc(l.levelKo || '')}${l.opp ? (l.success ? ' · 대항 승리' : ' · 대항 패배') : ''}</span></div>
        <div class="small muted">${esc(l.title)} · 기준 ${l.required ?? ''}${l.detail ? ` · ${esc(l.detail)}` : ''}</div></div></div>
      ${(l.canPush && !l.success) || luckOpts.length ? `<div class="row" style="margin-top:10px">
        ${l.canPush && !l.success ? `<button data-act="push" data-lid="${lid}">강행 판정 (실패하면 큰 대가)</button>` : ''}
        ${luckOpts.map((o) => `<button class="small" data-act="luck" data-lid="${lid}" data-cost="${o.cost}">운 ${o.cost} 써서 ${esc(o.levelKo)}</button>`).join('')}
      </div>` : ''}
    </section>`;
  }

  function viewCreate() {
    const d = ui.draft;
    const dv = E.derived(RULES, d.ch, { age: d.age });
    const base = normSkills(E.baseSkills(RULES, d.ch));
    const spent = Object.keys(d.skills).reduce((a, k) => a + Math.max(0, d.skills[k] - (base[k] || 0)), 0);
    const band = E.ageBand(RULES, d.age);
    const list = Object.keys(d.skills).filter((k) => !ui.filter || k.includes(ui.filter));
    return `<div class="p-body">
      <div><div class="label">New investigator · 탐사자 만들기</div><h1 class="title" style="margin:2px 0;font-size:30px">${esc(room.meta?.scenarioTitle || '')} 탐사자</h1></div>
      <div class="row"><button data-act="draftRoll">특성치 굴리기</button><button data-act="draftQuick">빠른 생성</button></div>
      <div class="chgrid"><label>이름<input value="${esc(d.name)}" data-change="draftField" data-f="name"></label><label>직업<input value="${esc(d.occupation)}" data-change="draftField" data-f="occupation"></label><label>나이<input type="number" min="15" max="89" value="${d.age}" data-change="draftField" data-f="age"></label><label>운<input type="number" value="${d.luck}" data-change="draftField" data-f="luck"></label></div>
      <div class="chgrid">${RULES.characteristics.map((c) => `<label>${c.ko}<input type="number" step="5" value="${d.ch[c.key]}" data-change="draftField" data-f="ch" data-k="${c.key}"></label>`).join('')}</div>
      <div class="card small">체력 ${dv.hpMax} · 마력 ${dv.mpMax} · 이성 ${dv.san} · 피해 보너스 ${dv.db} · 체구 ${dv.build} · 이동력 ${dv.mov}
        ${band && (band.reduce || band.APP || band.EDU) ? `<div class="muted">나이 보정: ${band.reduce ? `${band.reduceFrom.map((k) => CH_KO[k]).join('·')}에서 총 ${band.reduce} 빼기 ` : ''}${band.EDU ? `교육 ${band.EDU} ` : ''}${band.APP ? `외모 ${band.APP} ` : ''}${band.eduImprove ? `교육 향상 판정 ${band.eduImprove}회` : ''} — 직접 고쳐 넣으세요.</div>` : ''}</div>
      <div class="card small">기능 점수: 직업 기능 <b>${d.ch.EDU * 4}</b>(교육×4, 직업에 따라 다름) + 관심 기능 <b>${d.ch.INT * 2}</b>(지능×2) = ${d.ch.EDU * 4 + d.ch.INT * 2} · 지금 쓴 점수 <b class="${spent > d.ch.EDU * 4 + d.ch.INT * 2 ? 'bad' : 'ok'}">${spent}</b></div>
      <label>기능 찾기<input value="${esc(ui.filter)}" data-change="filter" placeholder="예: 관찰"></label>
      <div class="skills wide">${list.map((k) => `<span>${esc(k)} <span class="muted small">${base[k]}</span></span><input type="number" value="${d.skills[k]}" data-change="draftField" data-f="skill" data-k="${esc(k)}" aria-label="${esc(k)}">`).join('')}</div>
      <button class="primary" data-act="draftSave">이 탐사자로 들어가기</button>
    </div>`;
  }

  renderFn = () => {
    const inv = me();
    if (!inv) {
      if (!ui.draft) ui.draft = newDraft();
      $app.innerHTML = `<div class="p-wrap create">${viewCreate()}</div>`;
      return;
    }
    const mine = sortByAt(room.req).filter((r) => (r.to === 'all' || r.to === pid) && !(r.done && r.done[pid]));
    const myLogs = sortByAt(room.log).filter((l) => l.pid === pid);
    const lastId = ui.lastLog && room.log[ui.lastLog] ? ui.lastLog : myLogs.length ? myLogs[myLogs.length - 1].id : null;
    const hos = sortByAt(room.handouts);
    $app.innerHTML = `<div class="p-wrap" data-tab="${ui.tab}">
      <header class="p-head">
        <div class="mono small muted">${esc(inv.label || 'INVESTIGATOR')} · ${esc(room.meta?.scenarioTitle || '')} · ${esc(room.meta?.scene || '')} <span data-clock>${esc(clockText())}</span></div>
        <div class="row" style="justify-content:space-between;align-items:baseline"><span class="title" style="font-size:26px">${esc(inv.name)}</span><span class="small muted">${esc(inv.occupation || '')} · ${inv.age}세</span></div>
        <div class="p-stats">
          <div><div class="small muted">체력</div><div class="v">${inv.hp}<span class="small muted">/${inv.hpMax}</span></div></div>
          <div style="border-color:var(--sanLine)"><div class="small muted">이성</div><div class="v ok">${inv.san}<span class="small muted">/${inv.sanMax}</span></div></div>
          <div><div class="small muted">마력</div><div class="v">${inv.mp}</div></div>
          <div><div class="small muted">운</div><div class="v">${inv.luck}</div></div>
        </div>
      </header>
      <div class="p-body">
      <div class="pane pane-roll"><div class="label pane-title">Checks · 판정</div>
        ${(() => { const st = sortByAt(room.story).slice(-5); if (st.length) return `<section class="paper" aria-label="이야기"><div class="mono small muted">STORY · ${esc(room.meta?.scene || '')}</div>${st.map((x, i) => `<p style="font-size:${i === st.length - 1 ? 17 : 15}px;${i === st.length - 1 ? '' : 'opacity:.72;'}margin:8px 0">${x.npc ? `<b>${esc(x.npc)}</b>: “${esc(x.text)}”` : esc(x.text)}</p>`).join('')}</section>`; return room.table && room.table.read ? `<section class="paper" aria-label="지금 장면"><div class="mono small muted">SCENE · ${esc(room.table.title || '')}</div><p style="font-size:17px">${esc(room.table.read)}</p></section>` : ''; })()}
        ${room.meta?.auto && room.meta?.ai === 'thinking' ? '<div class="small gold" aria-live="polite">수호자가 이야기를 이어 가는 중…</div>' : ''}
        ${inv.needInt ? `<section class="card blood"><div class="label" style="color:var(--bloodText)">이성을 5 이상 잃었습니다</div><p class="small" style="margin:4px 0 10px">지능 판정에 성공하면 본 것을 온전히 이해해 일시적 광기에 빠집니다. 실패하면 기억을 억눌러 광기를 면합니다.</p><button class="primary" data-act="intRoll">지능 판정</button></section>` : ''}
        ${mine.map((r) => `<section class="card blood" aria-label="판정 요청">
          <div class="label" style="color:var(--bloodText)">Keeper requests · 판정 요청</div>
          <div style="font-size:18px;margin-top:2px">${esc(r.title)}</div>
          ${r.note ? `<div class="small muted">${esc(r.note)}</div>` : ''}
          ${r.skill === '대인관계' ? `<label style="margin-top:6px">어떤 기능으로?<select data-change="social" data-id="${r.id}">${SOCIAL.map((s) => `<option ${ui.social[r.id] === s ? 'selected' : ''}>${s}</option>`).join('')}</select></label>` : ''}
          <div class="row" style="justify-content:space-between;margin-top:10px">
            <span class="mono small">${esc(r.skill === '대인관계' ? '' : r.skill)} ${r.skill === '대인관계' ? '' : targetFor(inv, r.skill) ?? '?'}${r.difficulty === 'hard' ? ' · 어려움' : r.difficulty === 'extreme' ? ' · 극단적' : ''}${r.bonus ? ` · 보너스 ${r.bonus}` : ''}${r.penalty ? ` · 페널티 ${r.penalty}` : ''}${r.opposed ? ` · vs ${r.opposed.value}` : ''}</span>
            ${r.melee ? `<span class="row"><button class="primary" data-act="roll" data-id="${r.id}" data-def="dodge" style="min-height:48px;font-size:16px">회피 ${targetFor(inv, '회피') ?? '?'}</button><button data-act="roll" data-id="${r.id}" data-def="fightBack" style="min-height:48px;font-size:16px">반격</button></span>` : `<button class="primary" data-act="roll" data-id="${r.id}" style="min-height:48px;font-size:16px">주사위 굴리기</button>`}
          </div></section>`).join('')}
        ${lastId ? viewResult(room.log[lastId], lastId) : ''}
        ${inv.backstory ? `<section class="paper"><div class="mono small muted">BACKSTORY · ${esc(inv.label || '')}</div><p style="font-size:15px">${esc(inv.backstory)}</p></section>` : ''}
        <section class="card"><div class="label">Condition · 지금 상태</div><div>${esc(inv.state || '정상')}${inv.majorWound ? ' · 중상' : ''}</div><div class="small muted">오늘 잃은 이성 ${inv.lostToday || 0}</div></section>
        <section class="card stack"><div class="label">Say & do · 행동·말하기</div>
          <textarea id="chatText" rows="2" placeholder="예: 장롱 문을 천천히 열어 봅니다. / &quot;누구세요?&quot;"></textarea>
          <div class="row"><button class="primary" data-act="say">보내기</button>${room.meta?.auto ? `<button data-act="sayGo">보내고 수호자에게 넘기기</button><span class="small muted">AI 수호자가 진행 중 · 가만히 두면 ${room.meta.autoQuiet || 10}초 뒤 응답합니다</span>` : '<span class="small muted">수호자에게 보입니다</span>'}</div>
          <div class="log" style="max-height:200px">${sortByAt(room.chat).slice(-8).map((c) => `<div><b class="${c.pid === pid ? 'gold' : ''}">${esc(c.name)}</b> ${esc(c.text)}</div>`).join('')}</div>
        </section>
        <section class="card stack"><div class="label">Self roll · 스스로 굴리기</div><div class="row"><select id="selfSkill" aria-label="기능">${['운', ...RULES.characteristics.map((c) => c.ko), ...Object.keys(inv.skills)].map((k) => `<option>${esc(k)}</option>`).join('')}</select><select id="selfDiff" aria-label="난이도"><option value="regular">보통</option><option value="hard">어려움</option><option value="extreme">극단적</option></select><button data-act="selfRoll">굴리기</button></div></section>
      </div>
      <div class="pane pane-notes"><div class="label pane-title">Notebook · 수첩</div>${hos.length ? hos.reverse().map((h) => `<section class="paper"><div class="mono small muted">${esc(h.title)}</div>${h.image ? `<img class="handout-img" src="${h.image}" alt="${esc(h.title)}">` : ''}${h.text ? `<p style="margin-top:8px;font-size:16px">${esc(h.text)}</p>` : ''}${h.note ? `<div class="small muted">${esc(h.note)}</div>` : ''}</section>`).join('') : '<p class="muted">아직 받은 핸드아웃이 없습니다.</p>'}</div>
      <div class="pane pane-sheet">
        <section class="card"><div class="label">Characteristics · 특성치</div><div class="stats4" style="grid-template-columns:repeat(4,minmax(0,1fr))">${RULES.characteristics.map((c) => `<div>${c.ko} <b>${inv.ch[c.key]}</b><div class="small">${E.half(inv.ch[c.key])} / ${E.fifth(inv.ch[c.key])}</div></div>`).join('')}</div>
        <div class="small muted" style="margin-top:8px">피해 보너스 ${esc(inv.db)} · 체구 ${inv.build} · 이동력 ${inv.mov} · 최대 이성 ${inv.sanMax}</div></section>
        <section class="card stack"><div class="row" style="justify-content:space-between"><span class="label">Skills · 기능</span><button class="small" data-act="improve" ${Object.keys(inv.marks || {}).length ? '' : 'disabled'}>성장 판정 (${Object.keys(inv.marks || {}).length})</button></div>
        <label>기능 찾기<input value="${esc(ui.filter)}" data-change="filter"></label>
        <div class="skills">${Object.keys(inv.skills).filter((k) => !ui.filter || k.includes(ui.filter)).map((k) => `<span>${inv.marks && inv.marks[k] ? '<span class="gold">✓</span> ' : ''}${esc(k)} <span class="muted small">${E.half(inv.skills[k])}/${E.fifth(inv.skills[k])}</span></span><input type="number" value="${inv.skills[k]}" data-change="sheetSkill" data-k="${esc(k)}" aria-label="${esc(k)}">`).join('')}</div></section>
      </div>
      <div class="pane pane-log"><section class="card"><div class="label">My rolls · 내 굴림</div><div class="log" style="max-height:none">${myLogs.slice().reverse().map((l) => `<div><span class="n ${l.event ? 'gold' : l.success ? 'ok' : 'bad'}">${l.roll ?? '·'}</span> ${esc(l.title)} ${l.levelKo ? `— ${esc(l.levelKo)}` : ''} <span class="muted small">${esc(l.detail || '')}</span></div>`).join('')}</div></section></div>
      </div>
      <nav class="p-tabs" aria-label="탐사자 메뉴">${[['roll', `판정${mine.length ? ` (${mine.length})` : ''}`], ['notes', `수첩 ${hos.length}`], ['sheet', '시트'], ['log', '기록']].map(([t, ko]) => `<button class="${ui.tab === t ? 'on' : ''}" data-act="tab" data-t="${t}">${ko}</button>`).join('')}</nav>
    </div>`;
  };

  net = connect(ROOM, { local: LOCAL });
  subscribe();
  render();
}

// ═════════ 테이블 ═════════
function table() {
  renderFn = () => {
    const t = room.table || {};
    const logs = sortByAt(room.log).filter((l) => l.roll != null || l.event);
    const last = logs[logs.length - 1];
    const hos = sortByAt(room.handouts);
    const h = hos[hos.length - 1];
    const party = sortByAt(room.inv);
    $app.innerHTML = `<div class="t-wrap">
      <header class="row" style="justify-content:space-between;align-items:baseline">
        <div class="row" style="gap:16px;align-items:baseline"><span class="title" style="font-size:34px">${esc(room.meta?.scenarioTitle || '크툴루의 부름')}</span><span style="font-family:var(--fell);font-style:italic;font-size:20px;color:var(--muted)">${esc(room.meta?.scenarioHanja || '')}</span></div>
        <span class="mono gold" style="letter-spacing:.08em">${esc(t.title || room.meta?.scene || '')} <span data-clock class="bad">${esc(clockText())}</span></span>
      </header>
      <div class="t-mid">
        <section class="t-read" aria-label="장면 묘사">${esc(t.read || (room.meta?.epigraph || '수호자가 장면을 보내면 여기에 나타납니다.'))}</section>
        <aside class="t-side">
          ${last ? `<div class="card" aria-label="방금 굴린 주사위"><div class="mono gold small">${esc(last.name || '')} · ${esc(last.title)}</div>
            <div class="row" style="gap:18px;margin-top:8px">${last.roll != null ? `<span class="t-roll ${last.success ? 'ok' : 'bad'}">${last.roll}</span>` : ''}<div><div class="title ${last.success ? 'ok' : 'bad'}" style="font-size:28px">${esc(last.levelKo || '')}</div><div class="small muted">${last.required != null ? `기준 ${last.required}` : ''}${last.detail ? ` · ${esc(last.detail)}` : ''}</div></div></div></div>` : ''}
          ${h ? `<div class="paper" style="transform:rotate(1deg)"><div class="mono small muted">${esc(h.title)}</div>${h.image ? `<img class="handout-img" src="${h.image}" alt="${esc(h.title)}">` : ''}${!h.image && h.text ? `<p style="font-size:20px;margin-top:6px">${esc(h.text)}</p>` : ''}</div>` : ''}
        </aside>
      </div>
      <footer class="t-party" aria-label="탐사자 상태">${party.map((p) => `<div style="border-top-color:${/홀림|광기|중상|빈사|사망|의식/.test(p.state || '') ? 'var(--bloodText)' : 'var(--line3)'}"><div class="row" style="justify-content:space-between"><span style="font-size:18px">${esc(p.name)}</span><span class="small ${/홀림|광기|중상|빈사|사망|의식/.test(p.state || '') ? 'bad' : 'muted'}">${esc(p.state || '정상')}</span></div><div class="mono muted">체력 ${p.hp} · 이성 <span class="ok">${p.san}</span></div></div>`).join('')}</footer>
    </div>`;
  };
  net = connect(ROOM, { local: LOCAL });
  subscribe();
  render();
}

// ───────── 시작 ─────────
if (!ROOM || !ROLE) lobby();
else if (ROLE === 'keeper') keeper();
else if (ROLE === 'player') player();
else table();

</script>
</body>
</html>
